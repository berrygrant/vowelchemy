[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vowelchemy"
version = "0.1.0"
description = "A lab-friendly pipeline for turning conversational speech corpora into normalized, analyzable vowel data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vowelchemy contributors" }]
keywords = ["sociophonetics", "linguistics", "vowels", "forced-alignment", "corpus"]

# Core dependencies power the *analysis half* of the pipeline (normalization,
# filtering, visualization, separation metrics) plus the FastAPI backend that
# serves the React front-end. They are all pip-installable and lightweight. The
# *acquisition half* (Montreal Forced Aligner, new-fave) is orchestrated as
# external command-line tools and installed separately — see the README.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "httpx>=0.27"]
# Formant extraction. new-fave is a normal pip package (Python 3.10+), so it can
# ride along: `pip install "vowelchemy[extract]"`. MFA deliberately cannot —
# its Kaldi bindings are published on conda-forge only, so pip installs a broken
# aligner. Install MFA with conda/mamba and point the app at that environment.
extract = ["new-fave>=1.0"]

[project.scripts]
vowelchemy = "vowelchemy.cli:main"

[project.urls]
Homepage = "https://github.com/berrygrant/vowelchemy"

[tool.setuptools]
# src layout: the repo root has no folder named like the package, so students
# can't end up one `cd vowelchemy` too deep. Import name is unchanged.
package-dir = { "" = "src" }
packages = ["vowelchemy"]

[tool.setuptools.package-data]
# Ship the built React UI inside the wheel so `vowelchemy app` serves it
# from any install location (rebuild with `vowelchemy setup`).
vowelchemy = ["webui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set explicitly so lint results don't drift as ruff's defaults
# change between releases (pyflakes + pycodestyle errors).
select = ["E4", "E7", "E9", "F"]
