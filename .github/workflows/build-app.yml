name: Build desktop app

# Builds the double-clickable Vowelchemy desktop app (PyInstaller) for macOS
# and Windows and, for a release, attaches the zips to the GitHub release so
# students can download them from the Releases page.
#
# Runs three ways:
#   - called by "Release on version bump" after it tags a bumped main (the
#     usual path — see docs/RELEASING.md);
#   - on a version tag pushed by hand;
#   - on demand (Actions tab -> "Build desktop app" -> Run workflow), which
#     only uploads the zips as workflow artifacts.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.3)"
        required: true
        type: string
  workflow_dispatch:
  push:
    tags: ["v*"]

# Needed by the "Attach to release" step: without it the default GITHUB_TOKEN
# is read-only and creating the release fails with
# "403 Resource not accessible by integration" *after* the apps have built.
permissions:
  contents: write

env:
  # The tag being released: the caller's input, else the pushed tag, else none.
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A tag that does not match the declared version would ship an app that
      # announces its own release as an available update. Fail here, before
      # the (slow) builds, with the command that fixes it.
      - name: Check the tag matches the declared version
        if: env.RELEASE_TAG != ''
        run: python scripts/bump_version.py --check "$RELEASE_TAG"
        shell: bash
      - name: Install
        run: pip install . "pyinstaller>=6"
      - name: Build
        run: pyinstaller packaging/desktop/vowelchemy.spec --noconfirm
      - name: Package (macOS .app -> zip)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Vowelchemy.app Vowelchemy-macOS.zip
      - name: Package (Windows .exe -> zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Vowelchemy.exe -DestinationPath Vowelchemy-Windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Vowelchemy-${{ matrix.label }}
          path: Vowelchemy-${{ matrix.label }}.zip
      # Creates the release for the tag if it does not exist yet (both OS jobs
      # attach to the same one) with notes generated from the commits since
      # the previous release. The in-app update check reads this release.
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vowelchemy ${{ env.RELEASE_TAG }}
          files: Vowelchemy-${{ matrix.label }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'rc') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'dev') }}
