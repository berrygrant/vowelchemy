name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (backend + dev)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check vowelchemy tests
      - name: Test
        run: pytest -q
      # Optional integration smoke against MFA / new-fave / phonJSD; skips
      # automatically when those tools are not on PATH (see tests/test_smoke_tools.py).
      - name: Tool smoke (skips if tools absent)
        run: pytest -q tests/test_smoke_tools.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
